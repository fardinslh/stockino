name: Stockino CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  php-checks:
    name: PHP Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, json, mysqli
          tools: composer:v2, phpcs, phpunit
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint PHP Syntax
        run: find src tests -name "*.php" -exec php -l {} +

      - name: Run PHPCS Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Run PHPUnit Test Suite
        run: vendor/bin/phpunit

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Vite Production Build
        run: npm run build

      - name: Production Security Audit
        run: npm audit --omit=dev

  security-hygiene:
    name: Repository Hygiene & Conflict Marker Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Unresolved Conflict Markers
        run: |
          if git grep -nE '<<<<<<<|=======|>>>>>>>' -- ':!tests/' ':!.github/'; then
            echo "::error::Unresolved merge conflict markers found in repository!"
            exit 1
          else
            echo "Zero merge conflict markers found."
          fi

      - name: Check for Debug Code Leftovers
        run: |
          if git grep -nE 'var_dump\(|print_r\(' -- 'src/' 'stockino.php'; then
            echo "::error::Leftover debug calls (var_dump, print_r) found in src/!"
            exit 1
          else
            echo "Zero leftover debug calls found in src/."
          fi
